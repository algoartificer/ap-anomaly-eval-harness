
# vendors.yaml — synthetic AP vendor population
# Spec version: 1.1
# Status: DRAFT — see docs/assumptions.md open decisions D1, D2 before generating.

meta:
  spec_version: "1.1"
  currency: USD
  amount_decimals: 2
  period_start: "2025-01-01"
  period_end: "2025-12-31"
  normal_row_count: 500          # sum of vendors[].n_12mo, asserted at generation time
  amount_floor: 0.01             # applied after draw, before rounding

# Time-of-day model for all vendors unless overridden.
# Bimodal to mimic morning/afternoon AP posting peaks.
timestamp_defaults:
  calendar: business_days        # Mon-Fri, no holiday calendar in v1
  hour_bounds: ["08:00", "17:59"]
  modes:
    - { center: "10:45", weight: 0.5, sd_minutes: 55 }
    - { center: "14:45", weight: 0.5, sd_minutes: 55 }

# distribution: normal | lognormal | constant
#   lognormal is REQUIRED where cv > 0.40 — a Gaussian at cv 0.90 yields
#   negative draws ~13% of the time, which would contaminate edge case EC12.
#   Derive lognormal mu/sigma from the target arithmetic mean and sd.
vendors:
  - { id: V001, name: "Northgate Office Supply",   category: office_supplies,  mean: 340,    sd: 95,    cv: 0.28, freq_per_month: 4.00, n_12mo: 48, distribution: normal }
  - { id: V002, name: "Meridian IT Services",      category: it_consulting,    mean: 12500,  sd: 4200,  cv: 0.34, freq_per_month: 2.00, n_12mo: 24, distribution: normal }
  - { id: V003, name: "Cardinal Facilities Mgmt",  category: janitorial,       mean: 2850,   sd: 210,   cv: 0.07, freq_per_month: 1.00, n_12mo: 12, distribution: normal }
  - { id: V004, name: "BlueRidge Power",           category: utility,          mean: 4600,   sd: 900,   cv: 0.20, freq_per_month: 1.00, n_12mo: 12, distribution: normal, seasonality: { enabled: false, amplitude: 0.25, peak_months: [7, 8, 12, 1] } }
  - { id: V005, name: "Apex Travel Group",         category: travel,           mean: 1150,   sd: 780,   cv: 0.68, freq_per_month: 4.00, n_12mo: 48, distribution: lognormal }
  - { id: V006, name: "Sterling Legal LLP",        category: legal,            mean: 8900,   sd: 6400,  cv: 0.72, freq_per_month: 1.50, n_12mo: 18, distribution: lognormal }
  - { id: V007, name: "Quill & Press Printing",    category: printing,         mean: 620,    sd: 240,   cv: 0.39, freq_per_month: 3.00, n_12mo: 36, distribution: normal }
