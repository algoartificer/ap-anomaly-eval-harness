  - { id: V009, name: "Vantage Staffing",          category: contract_labor,   mean: 5400,   sd: 1100,  cv: 0.20, freq_per_month: 2.00, n_12mo: 24, distribution: normal }
  - { id: V010, name: "Lakeside Catering",         category: catering,         mean: 480,    sd: 310,   cv: 0.65, freq_per_month: 2.00, n_12mo: 24, distribution: lognormal }
  - { id: V011, name: "Precision Parts Co",        category: industrial_parts, mean: 3200,   sd: 1450,  cv: 0.45, freq_per_month: 3.00, n_12mo: 36, distribution: lognormal }
  - { id: V012, name: "Summit Insurance Brokers",  category: insurance,        mean: 9750,   sd: 300,   cv: 0.03, freq_per_month: 0.33, n_12mo: 4,  distribution: normal }
  - { id: V013, name: "Cobalt Software Licensing", category: saas,             mean: 1499,   sd: 0,     cv: 0.00, freq_per_month: 1.00, n_12mo: 12, distribution: constant }
  - { id: V014, name: "Ridgeway Construction",     category: capital_projects, mean: 24000,  sd: 15500, cv: 0.65, freq_per_month: 0.75, n_12mo: 9,  distribution: lognormal }
  - { id: V015, name: "Delta Fuel & Fleet",        category: fuel,             mean: 890,    sd: 260,   cv: 0.29, freq_per_month: 4.00, n_12mo: 48, distribution: normal, timestamp_overrides: { calendar: all_days } }   # see D1
