# Vendors that exist ONLY via injected edge cases. Not part of the 500.
injected_vendors:
  - { id: V021, name: "Halcyon Advisory",     category: consulting, note: "single transaction, no history" }
  - { id: V022, name: "Ironwood Surveying",   category: surveying,  note: "three transactions, first two near-identical" }

# Traps deliberately present in the NORMAL 500. These are not bugs.
designed_traps:
  - vendors: [V012, V014]
    condition: "n_12mo < rules.R3.min_prior_n"
    expect: "~13 normal rows classify REVIEW, not NO_FLAG"
  - vendors: [V013]
    condition: "sd == 0"
    expect: "z is 0/0 for every normal row; R8 must handle, R1 must not run"
  - vendors: [V003, V018]
    condition: "cv < 0.10"
    expect: "high R1 false-positive rate; ~3% amount variation reaches 2 sigma"
  - vendors: [V017]
    condition: "cv > 0.85"
    expect: "low R1 sensitivity; a 3x charge barely reaches z = 2"
  - vendors: [V002, V009]
    condition: "mean sits above a control limit in rules.R2.limits"
    expect: "3-5 structural R2 false positives in the clean 500 (defect D5)"
  - vendors: [V015]
    condition: "weekend activity under timestamp_overrides"
    expect: "~14 rows trip R4 if R4 remains day-of-week aware (defect D1)"
