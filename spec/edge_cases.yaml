    name: split_invoice_structuring
    sketch: "Three V009 invoices of ~4,000 within 5 days against one PO."
    blocked_by: "no PO/invoice relationship model in v1 — see assumption A05"
  - id: EC15
    name: near_duplicate_vendor_master
    sketch: "V023 'Harbor Freight Ways' alongside V008 'Harbor Freightways'."
    blocked_by: "vendor master assumed clean — see assumption A09"
